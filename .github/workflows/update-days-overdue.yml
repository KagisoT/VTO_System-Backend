name: Update days_overdue

on:
  schedule:
    - cron: '5 0 * * *' # 00:05 UTC daily
  workflow_dispatch:

jobs:
  update-days-overdue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run update SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/sql/update-days-overdue.sql
